project:
  type: book
  output-dir: ../docs/LUL

book:
  title: "Life under Lockdown"
  subtitle: "An anthology of Stellenbosch student Covid-19 diary entries"
  author: "Compiled by Johan Fourie and Laura Richardson"
  favicon: images/icon.png
  site-url: "https://www.johanfourie.com/LUL/"
  google-analytics: "G-TQJEXD9NM3"
  search: true
  reader-mode: true
  page-navigation: true
  # No repo-actions / repo-url on purpose: no "Edit this page" / "View source" links.
  open-graph:
    image: images/cover.jpg
    description: "Life under Lockdown – 335 diary entries by Stellenbosch students from the first month of South Africa's 2020 lockdown, free to read online."
  twitter-card:
    image: images/cover.jpg
    creator: "@johanfourieza"
    card-style: summary
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: |
      Free to read online &middot; &copy; 2022 African Sun Media and the editors
    right:
      - text: "About the editor ↗"
        href: "https://www.johanfourie.com"
  chapters:
    - index.qmd
    - foreword.md
    - introduction.md
    - part: "Week 1 · 21–27 March"
      chapters:
        - 2020-03-21.md
        - 2020-03-22.md
        - 2020-03-23.md
        - 2020-03-24.md
        - 2020-03-25.md
        - 2020-03-26.md
        - 2020-03-27.md
    - part: "Week 2 · 28 March – 3 April"
      chapters:
        - 2020-03-28.md
        - 2020-03-29.md
        - 2020-03-30.md
        - 2020-03-31.md
        - 2020-04-01.md
        - 2020-04-02.md
        - 2020-04-03.md
    - part: "Week 3 · 4–10 April"
      chapters:
        - 2020-04-04.md
        - 2020-04-05.md
        - 2020-04-06.md
        - 2020-04-07.md
        - 2020-04-08.md
        - 2020-04-09.md
        - 2020-04-10.md
    - part: "Week 4 · 11–17 April"
      chapters:
        - 2020-04-11.md
        - 2020-04-12.md
        - 2020-04-13.md
        - 2020-04-14.md
        - 2020-04-15.md
        - 2020-04-16.md
        - 2020-04-17.md
    - part: "Week 5 · 18–23 April"
      chapters:
        - 2020-04-18.md
        - 2020-04-19.md
        - 2020-04-20.md
        - 2020-04-21.md
        - 2020-04-22.md
        - 2020-04-23.md
    - about-this-book.md

format:
  html:
    theme: [cosmo, theme.scss]
    number-sections: false
    toc: true
    toc-depth: 2
    back-to-top: true
    date-modified: last-modified
    code-tools: false
    format-links: false        # HTML is the only edition – nothing to download
    include-after-body:
      - readonly.html
