    image: images/cover.jpg
    description: "Our Long Walk to Economic Freedom – a living, freely readable edition by Johan Fourie."
  twitter-card:
    image: images/cover.jpg
    creator: "@johanfourieza"
    card-style: summary
  sidebar:
