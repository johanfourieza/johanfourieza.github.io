# Shared with the main site – one bibliography, one source of truth.
bibliography: ../references.bib
# Pandoc's default citation style is Chicago author-date. To pin a style,
# drop a .csl file in this folder and set:  csl: chicago-author-date.csl

format:
  html:
    theme: [cosmo, theme.scss]
    number-sections: false   # chapter numbers are baked into titles ("1. ...")
    toc: true
    toc-depth: 2
    back-to-top: true
    date-modified: last-modified
    link-citations: true
    citations-hover: true
    crossrefs-hover: true
    code-tools: false
    format-links: false        # hide "Other Formats" – HTML is the only edition
    include-after-body:
      - readonly.html
