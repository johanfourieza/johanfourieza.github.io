  favicon: images/icon.png
  site-url: "https://www.johanfourie.com/OLWTEF/"
  google-analytics: "G-TQJEXD9NM3"
  search: true
  reader-mode: true
  page-navigation: true
  # No repo-actions / repo-url on purpose: no "Edit this page" / "View source" links.
