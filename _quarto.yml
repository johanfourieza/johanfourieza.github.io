project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!about_disabled.qmd"
  resources:
    - CNAME

website:
  title: ""
  site-url: "https://johanfourieza.github.io"
  favicon: images/icon.png
  google-analytics: "G-TQJEXD9NM3"
  open-graph:
    image: images/Johan_Fourie.jpg
    description: "Johan Fourie – Professor of Economics at Stellenbosch University"
  twitter-card:
    image: images/Johan_Fourie.jpg
    creator: "@johanfourieza"
    card-style: summary
  page-footer:
    center: "&copy; Johan Fourie"
  navbar:
    title: false
    alignment: center
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: students.qmd
        text: Students
      - href: teaching.qmd
        text: Teaching
      - href: public.qmd
        text: Public
      - href: econtools.qmd
        text: Tools
      - href: bookshop.qmd
        text: Bookshop

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    back-to-top: true
    date-modified: last-modified
    include-after-body:
      - text: |
          <script>
          document.addEventListener("DOMContentLoaded", function() {
            var d = document.querySelector(".date-modified");
            var f = document.querySelector(".nav-footer-center");
            if (d && f) {
              var s = document.createElement("p");
              s.className = "footer-modified";
              s.textContent = "Modified " + d.textContent;
              f.appendChild(s);
              var meta = document.querySelector(".quarto-title-meta");
              if (meta) meta.style.display = "none";
            }
          });
          </script>

editor: visual
